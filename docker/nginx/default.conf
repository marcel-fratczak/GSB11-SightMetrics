# nginx-vHost für GSB11 (TYPO3 13, Composer-Mode, Docroot .build/public)
# nginx vhost for GSB11 (TYPO3 13, composer mode, docroot .build/public)

# SightMetrics wertet nur das Frontend aus: Backend-Aufrufe (/typo3) landen
# nicht im Access-Log der Ingestion.
# SightMetrics analyses the frontend only: backend requests (/typo3) stay out
# of the ingestion's access log.
map $request_uri $sightmetrics_log {
    ~^/typo3  0;
    default   1;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/.build/public;
    index index.php;

    client_max_body_size 32m;

    # nginx-Version nicht im Server-Header/Fehlerseiten preisgeben
    # Do not disclose the nginx version in the Server header/error pages
    server_tokens off;

    # Sicherheits-Header. Kein CSP hier: TYPO3 v13 verwaltet Content-Security-
    # Policy selbst (Backend immer, Frontend per Site-Set). Kein HSTS hier: im
    # lokalen Betrieb gibt es kein TLS, hinter einem Proxy gehört HSTS an den Edge.
    # Achtung: Locations mit eigenem add_header erben diese Header NICHT –
    # deshalb gibt es unten keine location-eigenen add_header.
    # Security headers. No CSP here: TYPO3 v13 manages Content-Security-Policy
    # itself (backend always, frontend via site set). No HSTS here: no TLS in
    # local operation, and behind a proxy HSTS belongs at the edge.
    # Note: locations with their own add_header do NOT inherit these headers –
    # hence no location-level add_header below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Relative Redirects: behalten Schema/Host/Port des Aufrufs (sonst verliert
    # z. B. /typo3 den gemappten Port -> Connection refused).
    # Relative redirects keep the request's scheme/host/port (otherwise e.g.
    # /typo3 loses the mapped port -> connection refused).
    absolute_redirect off;

    # Erstes Log wie bisher nach stdout (docker compose logs), zweites im
    # Combined-Format für die SightMetrics-Ingestion (Volume sightmetrics-logs).
    # Locations mit 'access_log off' (Healthcheck, statische Assets) fehlen in
    # beiden – für die Auswertung zählen ohnehin nur Seitenaufrufe.
    # First log to stdout as before; second in combined format for the
    # SightMetrics ingestion. Locations with 'access_log off' are in neither.
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/sightmetrics/access.log combined if=$sightmetrics_log;

    # Healthcheck ohne TYPO3 / healthcheck without TYPO3
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 240;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # expires setzt den Cache-Control-Header; bewusst kein add_header hier,
    # damit die Sicherheits-Header des server-Blocks vererbt bleiben.
    # expires sets the Cache-Control header; deliberately no add_header here
    # so the server block's security headers stay inherited.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
