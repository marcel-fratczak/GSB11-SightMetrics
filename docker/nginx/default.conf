# nginx-vHost für GSB11 (TYPO3 13, Composer-Mode, Docroot .build/public)
# nginx vhost for GSB11 (TYPO3 13, composer mode, docroot .build/public)

# ---- SightMetrics-Access-Log / SightMetrics access log -----------------------

# Nur das Frontend: Backend-Aufrufe (/typo3) landen nicht im Log der Ingestion.
# Frontend only: backend requests (/typo3) stay out of the ingestion's log.
map $request_uri $sightmetrics_log {
    ~^/typo3  0;
    default   1;
}

# Eine Datei pro Kalendertag in der Zeitzone TZ (= SM_TZ, compose.yaml). Ein
# abgeschlossener Tag wird vollständig importiert; scripts/sightmetrics-import.sh
# löscht alte Dateien nach SM_LOG_RETENTION_DAYS. Keine Rotation per Umbenennen:
# Die Ingestion begänne danach bei Byte 0 der neuen Datei, und die noch
# zurückgestellten Zeilen des laufenden Tags in der alten gingen verloren.
# One file per calendar day in time zone TZ (= SM_TZ). A completed day is
# imported in full; the import script deletes old files after
# SM_LOG_RETENTION_DAYS. No rename-based rotation: the ingestion would restart
# at byte 0 of the new file and lose the held-back lines of the current day.
map $time_iso8601 $sightmetrics_day {
    "~^(?<sightmetrics_ymd>\d{4}-\d{2}-\d{2})"  $sightmetrics_ymd;
    default                                     unknown;
}

# Besucher-IP: Kommt der Request von einer Adresse aus REVERSE_PROXY_IP, zählt
# der letzte Eintrag in X-Forwarded-For (vom Proxy gesetzt), sonst die
# TCP-Gegenstelle. Die Adressliste schreibt 30-sightmetrics.sh beim Start.
# Bewusst nicht das realip-Modul: Es schriebe REMOTE_ADDR um, TYPO3 erkennte
# den Proxy nicht mehr, und REVERSE_PROXY_SSL griffe nicht (http-Links,
# Redirect-Schleifen). So ändert sich nur das Log.
# Visitor IP: for requests from an address in REVERSE_PROXY_IP the last
# X-Forwarded-For entry (set by the proxy) counts, otherwise the TCP peer.
# Deliberately not the realip module: it would rewrite REMOTE_ADDR, TYPO3 would
# no longer recognise the proxy and REVERSE_PROXY_SSL would not apply.
geo $sightmetrics_from_proxy {
    default 0;
    include /run/sightmetrics/proxies.conf;
}

map "$sightmetrics_from_proxy:$http_x_forwarded_for" $sightmetrics_client {
    "~^1:.*?(?<sightmetrics_xff>[0-9A-Fa-f:.]+)\s*$"  $sightmetrics_xff;
    default                                           $remote_addr;
}

# Combined-Format, nur mit der Besucher-IP statt $remote_addr
# Combined format, with the visitor IP instead of $remote_addr
log_format sightmetrics '$sightmetrics_client - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /var/www/html/.build/public;
    index index.php;

    client_max_body_size 32m;

    # nginx-Version nicht im Server-Header/Fehlerseiten preisgeben
    # Do not disclose the nginx version in the Server header/error pages
    server_tokens off;

    # Sicherheits-Header. Kein CSP hier: TYPO3 v13 verwaltet Content-Security-
    # Policy selbst (Backend immer, Frontend per Site-Set). Kein HSTS hier: im
    # lokalen Betrieb gibt es kein TLS, hinter einem Proxy gehört HSTS an den Edge.
    # Achtung: Locations mit eigenem add_header erben diese Header NICHT –
    # deshalb gibt es unten keine location-eigenen add_header.
    # Security headers. No CSP here: TYPO3 v13 manages Content-Security-Policy
    # itself (backend always, frontend via site set). No HSTS here: no TLS in
    # local operation, and behind a proxy HSTS belongs at the edge.
    # Note: locations with their own add_header do NOT inherit these headers –
    # hence no location-level add_header below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Relative Redirects: behalten Schema/Host/Port des Aufrufs (sonst verliert
    # z. B. /typo3 den gemappten Port -> Connection refused).
    # Relative redirects keep the request's scheme/host/port (otherwise e.g.
    # /typo3 loses the mapped port -> connection refused).
    absolute_redirect off;

    # Erstes Log wie bisher nach stdout (docker compose logs, mit der
    # TCP-Gegenstelle), zweites als Tagesdatei für die SightMetrics-Ingestion
    # (Volume sightmetrics-logs). Locations mit 'access_log off' (Healthcheck,
    # statische Assets) fehlen in beiden – es zählen ohnehin nur Seitenaufrufe.
    # First log to stdout as before (with the TCP peer), second as a day file for
    # the SightMetrics ingestion. Locations with 'access_log off' are in neither.
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/sightmetrics/access-$sightmetrics_day.log sightmetrics if=$sightmetrics_log;
    # Variable im Pfad: Dateideskriptoren cachen statt die Datei je Zeile zu öffnen
    # Variable in the path: cache file descriptors instead of reopening per line
    open_log_file_cache max=4 inactive=1m;

    # Healthcheck ohne TYPO3 / healthcheck without TYPO3
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 240;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # expires setzt den Cache-Control-Header; bewusst kein add_header hier,
    # damit die Sicherheits-Header des server-Blocks vererbt bleiben.
    # expires sets the Cache-Control header; deliberately no add_header here
    # so the server block's security headers stay inherited.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
